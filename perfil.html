<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2A1748">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%232A1748'/%3E%3Ccircle cx='20' cy='20' r='12' fill='none' stroke='%23C9B3F5' stroke-width='3'/%3E%3Cpath d='M20 20 28 14' stroke='%23C9B3F5' stroke-width='3.4' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Kalam:wght@400;700&display=swap">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
  <title>Meu perfil · Ciclo 360°</title>
</head>
<body>
  <header id="app-header"></header>
  <main class="container page">
    <section class="profile-card">
      <div class="avatar" id="p-avatar" aria-hidden="true"></div>
      <div>
        <h1 id="p-nome">Meu perfil</h1>
        <p class="info" id="p-info"></p>
        <div class="lvl"><span id="p-lvl-label"></span><b id="p-lvl"></b></div>
        <div class="meter"><span id="p-lvl-bar"></span></div>
        <div class="lvl" style="margin-top:6px"><span id="p-lvl-next"></span></div>
      </div>
    </section>

    <section class="profile-top">
      <div class="panel">
        <h2>Por dificuldade</h2>
        <div class="bars" id="p-diff"></div>
      </div>
      <div class="panel">
        <h2>Por tema</h2>
        <div class="bars" id="p-tema"></div>
      </div>
    </section>

    <section class="section">
      <h2>Conquistas</h2>
      <div class="badges" id="p-badges"></div>
    </section>

    <section class="section">
      <h2>Últimos desafios concluídos</h2>
      <div class="panel"><ul class="history" id="p-hist"></ul></div>
    </section>

    <section class="section">
      <h2>Configurações</h2>
      <div class="danger-zone">
        <button class="btn btn--danger" id="btn-reset">Apagar meu progresso</button>
      </div>
    </section>
    <p class="storage-note" id="storage-note"></p>
  </main>
  <script src="js/vendor/supabase-2.117.2.js"></script>
  <script src="js/config.js"></script>
  <script src="js/data/challenges.js"></script>
  <script src="js/core/answers.js"></script>
  <script src="js/core/scoring.js"></script>
  <script src="js/services/storage-local.js"></script>
  <script src="js/services/storage-api.js"></script>
  <script src="js/services/storage-supabase.js"></script>
  <script src="js/services/db.js"></script>
  <script src="js/ui/layout.js"></script>
  <script src="js/pages/perfil.js"></script>
</body>
</html>
