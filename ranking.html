<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2A1748">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%232A1748'/%3E%3Ccircle cx='20' cy='20' r='12' fill='none' stroke='%23C9B3F5' stroke-width='3'/%3E%3Cpath d='M20 20 28 14' stroke='%23C9B3F5' stroke-width='3.4' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Kalam:wght@400;700&display=swap">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
  <title>Ranking · Ciclo 360°</title>
</head>
<body>
  <header id="app-header"></header>
  <main class="container page">
    <div class="page-head">
      <div>
        <h1>Ranking</h1>
        <p class="lead">Quem acerta de primeira ganha mais pontos.</p>
      </div>
    </div>
    <section class="toolbar" aria-label="Filtros do ranking">
      <div class="field field--wide">
        <label for="f-turma">Turma</label>
        <select class="input" id="f-turma"><option value="">Todas</option></select>
      </div>
      <div id="prof-tools" class="prof-tools" hidden>
        <button class="btn" id="btn-csv">Baixar planilha</button>
        <button class="btn btn--ghost" id="btn-demo">Tirar exemplos</button>
      </div>
    </section>
    <section class="podium" id="podium" aria-label="Três primeiros colocados"></section>
    <div class="table-wrap">
      <table class="rank">
        <caption class="sr-only">Classificação completa</caption>
        <thead><tr><th>#</th><th>Aluno</th><th class="hide-sm">Turma</th><th class="num">Feitos</th><th class="num">Pontos</th><th class="hide-sm">Último</th></tr></thead>
        <tbody id="rank-body"></tbody>
      </table>
    </div>
    <p class="storage-note" id="storage-note"></p>
  </main>
  <script src="js/vendor/supabase-2.117.2.js"></script>
  <script src="js/config.js"></script>
  <script src="js/data/challenges.js"></script>
  <script src="js/core/answers.js"></script>
  <script src="js/core/scoring.js"></script>
  <script src="js/services/storage-local.js"></script>
  <script src="js/services/storage-api.js"></script>
  <script src="js/services/storage-supabase.js"></script>
  <script src="js/services/db.js"></script>
  <script src="js/ui/layout.js"></script>
  <script src="js/pages/ranking.js"></script>
</body>
</html>
