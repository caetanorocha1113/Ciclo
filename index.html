<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2A1748">
  <meta name="description" content="Desafios de ciclo trigonométrico para fazer com o material Ciclo 360°.">
  <title>Ciclo 360° · Entrar</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%232A1748'/%3E%3Ccircle cx='20' cy='20' r='12' fill='none' stroke='%23C9B3F5' stroke-width='3'/%3E%3Cpath d='M20 20 28 14' stroke='%23C9B3F5' stroke-width='3.4' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Kalam:wght@400;700&display=swap">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/lesson.css">
</head>
<body>
  <div class="auth">
    <section class="auth__hero" aria-label="Sobre o Ciclo 360°">
      <div class="auth__brand">
        <svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="16" fill="none" stroke="currentColor" stroke-width="3"/><path d="M20 20 L31 11" stroke="currentColor" stroke-width="3.4" stroke-linecap="round"/><circle cx="20" cy="20" r="3.2" fill="currentColor"/></svg>
        Matemática que Transforma
      </div>

      <div class="auth__intro">
        <h1 class="auth__title">Ciclo 360°</h1>
        <p class="auth__tagline">Gire o ponteiro e descubra a resposta.</p>
        <svg class="auth__cycle" id="heroCycle" viewBox="0 0 240 240" role="img" aria-label="Ciclo trigonométrico com o ponteiro girando até 150 graus">
          <circle cx="120" cy="120" r="112" fill="rgba(201,179,245,.08)"/>
          <line x1="14" y1="120" x2="226" y2="120" stroke="#8FB8FF" stroke-width="1.6" opacity=".55"/>
          <line x1="120" y1="14" x2="120" y2="226" stroke="#FF9A8B" stroke-width="1.6" opacity=".55"/>
          <circle cx="120" cy="120" r="90" fill="none" stroke="#C9B3F5" stroke-width="3"/>
          <g id="heroTicks" stroke="#C9B3F5" stroke-width="2.4" stroke-linecap="round"></g>
          <line id="heroSen" x1="120" y1="120" x2="120" y2="120" stroke="#FF9A8B" stroke-width="2.6" stroke-dasharray="5 4"/>
          <line id="heroCos" x1="120" y1="120" x2="120" y2="120" stroke="#8FB8FF" stroke-width="2.6" stroke-dasharray="5 4"/>
          <line id="heroPtr" x1="120" y1="120" x2="210" y2="120" stroke="#F3ECFF" stroke-width="6" stroke-linecap="round"/>
          <circle id="heroTip" cx="210" cy="120" r="6" fill="#F3ECFF"/>
          <circle cx="120" cy="120" r="7" fill="#C9B3F5" stroke="#2A1748" stroke-width="2"/>
          <path id="heroArc" d="" fill="none" stroke="#F3ECFF" stroke-width="2" opacity=".7"/>
          <text id="heroDeg" x="134" y="104" fill="#F3ECFF" font-family="Kalam, sans-serif" font-size="22" font-weight="700">0°</text>
        </svg>
      </div>

      <ul class="auth__features">
        <li><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M8 8h8M8 12h8M8 16h5"/></svg></span>
          <span><b>25 desafios</b></span></li>
        <li><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 12 19 8"/></svg></span>
          <span><b>Use com o ciclo de papelão</b></span></li>
        <li><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 21V11H4v10M14 21V5h-4v16M20 21v-7h-4v7"/></svg></span>
          <span><b>Ganhe pontos e medalhas</b></span></li>
      </ul>
    </section>

    <main class="auth__main">
      <div class="panel auth__card">
        <div class="radi-hello" id="radi-hello" aria-live="polite"></div>

        <div class="segmented auth__switch" role="tablist" aria-label="Escolha entre entrar e criar conta">
          <input type="radio" name="modo" id="tab-login" checked><label for="tab-login" role="tab">Entrar</label>
          <input type="radio" name="modo" id="tab-signup"><label for="tab-signup" role="tab">Criar conta</label>
        </div>

        <form id="form-login" novalidate>
          <div class="field">
            <label for="login-email">E-mail</label>
            <input class="input" id="login-email" type="email" autocomplete="email" inputmode="email" placeholder="seu@email.com" required>
          </div>
          <div class="field">
            <label for="login-senha">Senha</label>
            <div class="password">
              <input class="input" id="login-senha" type="password" autocomplete="current-password" required>
              <button type="button" class="password__toggle" data-toggle="login-senha">Mostrar</button>
            </div>
          </div>
          <label class="check"><input type="checkbox" id="login-lembrar" checked> Lembrar de mim</label>
          <p class="field-error" id="login-erro" role="alert"></p>
          <button class="btn btn--primary btn--block btn--lg" type="submit">Entrar</button>
        </form>

        <form id="form-signup" hidden novalidate>
          <div class="field">
            <span class="field-label">Eu sou</span>
            <div class="segmented">
              <input type="radio" name="papel" id="papel-aluno" value="aluno" checked><label for="papel-aluno">Aluno</label>
              <input type="radio" name="papel" id="papel-prof" value="professor"><label for="papel-prof">Professor</label>
            </div>
          </div>
          <div class="field">
            <label for="su-nome">Seu nome</label>
            <input class="input" id="su-nome" autocomplete="name" autocapitalize="words" required>
          </div>
          <div class="field">
            <label for="su-turma">Turma</label>
            <input class="input" id="su-turma" placeholder="ex.: 2º A" list="turmas" required>
            <datalist id="turmas"></datalist>
          </div>
          <div class="field">
            <label for="su-email">E-mail</label>
            <input class="input" id="su-email" type="email" autocomplete="email" inputmode="email" placeholder="seu@email.com" required>
          </div>
          <div class="field">
            <label for="su-senha">Senha</label>
            <div class="password">
              <input class="input" id="su-senha" type="password" autocomplete="new-password" minlength="6" placeholder="6 letras ou números" required>
              <button type="button" class="password__toggle" data-toggle="su-senha">Mostrar</button>
            </div>
          </div>
          <p class="field-error" id="su-erro" role="alert"></p>
          <button class="btn btn--primary btn--block btn--lg" type="submit">Criar conta</button>
        </form>
        <p class="storage-note" id="storage-note"></p>
      </div>
    </main>
  </div>

  <script src="js/vendor/supabase-2.117.2.js"></script>
  <script src="js/config.js"></script>
  <script src="js/data/challenges.js"></script>
  <script src="js/core/answers.js"></script>
  <script src="js/core/scoring.js"></script>
  <script src="js/services/storage-local.js"></script>
  <script src="js/services/storage-api.js"></script>
  <script src="js/services/storage-supabase.js"></script>
  <script src="js/services/db.js"></script>
  <script src="js/ui/layout.js"></script>
  <script src="js/ui/mascot.js"></script>
  <script src="js/pages/login.js"></script>
</body>
</html>
