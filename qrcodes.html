<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2A1748">
  <title>QR codes · Ciclo 360°</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Kalam:wght@400;700&display=swap">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/lesson.css">
  <link rel="stylesheet" href="css/qrcodes.css">
</head>
<body>
  <main class="container page">
    <div class="qr-tools no-print">
      <a class="btn btn--ghost btn--sm" href="desafios.html">← Voltar</a>
      <h1>QR codes</h1>
      <p class="lead">Um por nível. Imprima e cole na sala ou no material.</p>
      <div class="field">
        <label for="qr-url">Endereço do site</label>
        <input class="input" id="qr-url" type="url" inputmode="url" placeholder="https://seu-site.netlify.app/">
      </div>
      <p class="qr-warn" id="qr-warn" hidden></p>
      <div class="qr-actions">
        <button class="btn btn--primary btn--lg" id="qr-print">🖨 Imprimir</button>
      </div>
    </div>
    <div class="qr-sheet" id="qr-sheet"></div>
  </main>
  <script src="js/vendor/qrcode-generator-2.0.4.js"></script>
  <script src="js/config.js"></script>
  <script src="js/data/challenges.js"></script>
  <script src="js/ui/mascot.js"></script>
  <script src="js/pages/qrcodes.js"></script>
</body>
</html>
